<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tompakan</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial;padding-top:100px;">

<h1>Tompakan</h1>

<input id="code" placeholder="Enter your nagan">
<button onclick="checkCode()">Submit</button>

<div id="result"></div>

<script>
function checkCode() {
    const name = document.getElementById("code").value.trim().toLowerCase();

    const valid = [
        "zuriel",
        "sibon",
        "rheen li",
        "jowens",
        "jeric",
        "arnel",
        "klinton",
        "nysun"
    ];

    if (!valid.includes(name)) {
        document.getElementById("result").innerHTML = "❌ nagan mo ha ot";
        return;
    }

    document.body.innerHTML = `
    <div style="background:black;color:#00ff00;height:100vh;padding:20px;font-family:monospace">
        <h1>INITIALIZING BREACH...</h1>
    </div>
    `;

    setTimeout(() => {
        document.body.innerHTML = `
        <div style="background:black;color:#00ff00;height:100vh;padding:20px;font-family:monospace">
            <h1>ACCESS GRANTED</h1>
        </div>
        `;
    }, 2000);

    setTimeout(() => {
        document.body.innerHTML = `
        <div style="background:#111;color:white;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
            <h1>😂 LOKDIT MO!</h1>
            <p>hahahaha mission success😎</p>
            <p>Created by Earl</p>
        </div>
        `;
    }, 4000);
}
</script>

</body>
</html>
